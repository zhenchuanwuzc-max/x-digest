<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>人物成长研究</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<style>
:root{
  --bg:#f3f1eb; --surface:#fffcf7; --ink:#1a1c1b; --ink-2:#3d433f; --mut:#59656b;
  --line:#e2ddd2; --accent:#1f4f63; --accent-soft:#e5f0f4; --teal:#0d6b52; --teal-soft:#e4f3ec;
  --shadow:0 1px 2px rgba(26,28,27,.04),0 8px 24px rgba(26,28,27,.06);
  --r:14px; --nav-w:13rem;
}
*{box-sizing:border-box}
html{color-scheme:light;scroll-behavior:auto}
body{
  margin:0;color:var(--ink);background:var(--bg);
  font:16.5px/1.7 "PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:#cfe0e8;color:var(--ink)}
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);gap:0;min-height:100vh;max-width:74rem;margin:0 auto}
.nav{
  position:sticky;top:0;align-self:start;height:100vh;
  padding:1.5rem 1rem 2rem 1.15rem;border-right:1px solid var(--line);
  background:linear-gradient(180deg,#f0f4f6,var(--bg));overflow:auto;
}
.brand-row{display:flex;align-items:center;gap:.55rem;margin:0 0 .35rem}
.brand-row img{width:28px;height:28px;border-radius:7px;flex:0 0 auto}
.nav .brand{font-weight:750;font-size:.95rem;letter-spacing:-.02em;margin:0;line-height:1.35}
.nav .meta{font-size:.78rem;color:var(--mut);margin:0 0 1.1rem;line-height:1.45}
.nav a{display:block;color:var(--ink-2);text-decoration:none;font-size:.88rem;padding:.38rem .55rem;border-radius:8px;margin:.12rem 0}
.nav a:hover,.nav a:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
.nav .sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:1rem 0 .35rem;padding-left:.55rem}
.main{padding:1.75rem 1.5rem 4.5rem;max-width:62rem}
h1{font-size:clamp(1.4rem,2.3vw,1.8rem);line-height:1.28;letter-spacing:-.025em;margin:0 0 .55rem;font-weight:750}
h2{font-size:1.12rem;line-height:1.35;margin:2rem 0 .75rem;padding-bottom:.45rem;border-bottom:2px solid var(--accent);letter-spacing:-.015em;font-weight:700}
.muted{color:var(--mut);font-size:.94rem;line-height:1.6;margin:.4rem 0 1.2rem}
.lead{
  background:linear-gradient(180deg,#eef5f8,var(--surface));
  border:1px solid #c5d8e0;border-radius:var(--r);padding:1.05rem 1.15rem;margin:0 0 1.4rem;
  box-shadow:var(--shadow);font-size:.98rem;color:var(--ink-2);
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .grid{grid-template-columns:1fr}
}
.card{
  display:flex;flex-direction:column;gap:.55rem;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:1.15rem 1.2rem;box-shadow:var(--shadow);text-decoration:none;color:inherit;
}
.card .ico{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:1.15rem;font-weight:750;
}
.card h3{margin:0;font-size:1.08rem;line-height:1.35;letter-spacing:-.015em;color:var(--ink)}
.card p{margin:0;font-size:.92rem;line-height:1.55;color:var(--ink-2)}
.card .meta{margin:0;font-size:.78rem;color:var(--mut)}

.tag{
  display:inline-block;font-size:11.5px;font-weight:650;line-height:1.4;
  background:var(--teal-soft);color:var(--teal);padding:.12rem .45rem;border-radius:999px;margin-right:.25rem;
}
.tag.new{background:#fff0d6;color:#8a5a00}
.foot{margin-top:2.2rem;font-size:.82rem;color:var(--mut)}
.foot a{color:var(--accent)}
.card:target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

a.card:hover,a.card:focus-visible{border-color:#9bb8c4;outline:none}
.card h3{display:flex;gap:.5rem;align-items:center}.card h3 .ico{width:28px;height:28px;font-size:.85rem;border-radius:7px}
.card{padding:.8rem 1rem;gap:.3rem}.card p{font-size:.86rem}
.total{margin:0;padding-left:1.1rem}.total li{margin:.35rem 0}
.prs{display:grid;gap:.8rem}.pr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.85rem 1rem}
.bms{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.6rem;margin:.2rem 0 .7rem}.bm{border-left:3px solid var(--accent);background:#f6faf8;border-radius:8px;padding:.5rem .7rem}.bws{margin:.1rem 0 .3rem;padding-left:1.1rem;font-size:.85rem}.bws li{margin:.2rem 0}.bm p{margin:.15rem 0;font-size:.87rem}.bn a{font-weight:750;font-size:1.02rem;color:var(--accent)}.bl b,.bs b{display:inline-block;font-size:.72rem;border-radius:999px;padding:0 .4rem;margin-right:.35rem}.bl b{background:#e4f3ec;color:#0d6b52}.bs b{background:#fff0d6;color:#8a5a00}.pr .lv{display:block;font-size:.78rem;color:var(--mut)}.pr h3{margin:0 0 .2rem;font-size:1rem}.pr .lv{margin:0 0 .5rem;font-size:.8rem;color:var(--mut)}
.pr dl,.pc dl{display:grid;grid-template-columns:7.2em minmax(0,1fr);gap:.25rem .6rem;margin:0;font-size:.88rem}
.pr dt,.pc dt{color:var(--mut);font-weight:600}.pr dd,.pc dd{margin:0}
.steps li,.obs li{margin:.3rem 0}.obs{color:var(--ink-2);font-size:.9rem}
.pc .nf{color:var(--mut)}.k.f{font-size:.68rem;background:#e4f3ec;color:#0d6b52;border-radius:999px;padding:.05rem .35rem;margin-left:.3rem}.k.s{font-size:.68rem;background:#fff0d6;color:#8a5a00;border-radius:999px;padding:.05rem .35rem;margin-left:.3rem}
.pc details{font-size:.78rem;color:var(--mut)}.pc details ul{padding-left:1rem;margin:.3rem 0}.pc .go{font-size:.84rem;font-weight:650;color:var(--accent);text-decoration:none}
.pc h3 a{color:inherit;text-decoration:none}
@media(max-width:560px){.pr dl,.pc dl{grid-template-columns:1fr}.pr dt,.pc dt{margin-top:.25rem}}
.legend{font-size:.82rem;color:var(--mut);margin:.2rem 0 .5rem}
.cmp{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:.5rem .55rem;text-align:left;vertical-align:top}
.cmp thead th{font-size:.76rem;color:var(--mut);font-weight:650;background:#f4f1ea;white-space:nowrap}
.cmp tbody th{width:9.5rem;font-weight:700}.cmp tbody th a{color:var(--accent);text-decoration:none;font-size:.95rem}
.cmp .hd{display:block;font-weight:400;font-size:.74rem;color:var(--mut)}
.cmp .does{display:block}.cmp .usr{display:block;color:var(--mut);font-size:.8rem;margin-top:.15rem}
.cmp td.m{width:7.2rem;font-variant-numeric:tabular-nums}.cmp td.m:last-child{width:11rem}
.cmp .nf{color:var(--mut)}.cmp .k{display:inline-block;margin:.1rem 0 0}
.cmp details{font-size:.74rem;font-weight:400;color:var(--mut);margin-top:.25rem}.cmp details ul{padding-left:1rem;margin:.25rem 0;overflow-wrap:anywhere}
@media(max-width:820px){
 .cmp,.cmp tbody,.cmp tr,.cmp th,.cmp td{display:block;width:auto!important}
 .cmp thead{display:none}.cmp{border:0;background:none}
 .cmp tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem;margin:0 0 .55rem}
 .cmp th,.cmp td{border:0;padding:.15rem 0}
 .cmp td.m{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.4rem}
 .cmp td.m::before{content:attr(data-l);font-size:.78rem;color:var(--mut)}
 .cmp details ul{width:auto}
}

.people-toolbar{margin:.4rem 0 1rem;padding:.75rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.people-toolbar .pt-row{display:flex;flex-wrap:wrap;gap:.45rem .55rem;align-items:center;margin:.25rem 0}
.people-toolbar .pt-lab{flex:0 0 auto;font-size:.78rem;font-weight:650;color:var(--mut);min-width:6.5rem}
.people-toolbar .pt-btns{display:flex;flex-wrap:wrap;gap:.35rem;min-width:0}
.people-toolbar .ptb{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink-2);font:inherit;font-size:.82rem;padding:.28rem .55rem;border-radius:999px;cursor:pointer;line-height:1.3}
.people-toolbar .ptb:hover,.people-toolbar .ptb:focus-visible{border-color:var(--accent);outline:2px solid var(--accent-soft);outline-offset:1px}
.people-toolbar .ptb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.people-toolbar .pt-meta{justify-content:space-between;gap:.75rem;font-size:.84rem;color:var(--mut)}
.people-empty{margin:.35rem 0 0;padding:.55rem .7rem;background:#fff0d6;border-radius:8px;color:#8a5a00;font-size:.88rem}
@media(max-width:820px){
  .people-toolbar .pt-lab{min-width:100%;margin-bottom:.1rem}
  .people-toolbar .ptb{font-size:.8rem}
}
</style>
